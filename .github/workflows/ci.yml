name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 纯函数与知识库读写门禁，不联网
      - name: selftest (47 checks)
        run: node tests/selftest.mjs

      # 用假 ctx 驱动真实工具。其中 bili_learn 不带 transcript_text 的几例会真的访问
      # B 站接口拿元数据/字幕轨；数据中心 IP 可能被限流，所以这里不阻塞流水线。
      - name: tool-test (10 tools)
        continue-on-error: true
        run: node tests/tool-test.mjs
